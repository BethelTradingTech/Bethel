<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bethel Visitor Reviews</title><style>body{font-family:Arial,sans-serif;background:#07101c;color:#eef2f7;margin:0;padding:24px}.wrap{max-width:1000px;margin:auto}.card{background:#0d1726;border:1px solid #223047;border-radius:14px;padding:18px;margin:12px 0}.stars{color:#fbbf24}.meta{color:#9aa8bb;font-size:13px}.actions{display:flex;gap:8px;margin-top:12px}button{border:0;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}.approve{background:#10b981}.reject{background:#ef4444;color:white}select{padding:8px;border-radius:8px;background:#111c2e;color:white;border:1px solid #334155}</style></head><body><div class="wrap"><h1>Visitor Reviews</h1><p>Moderate genuine visitor feedback. Reject only spam, abuse, sensitive/personal data, impersonation, or non-review content—not because a rating is negative.</p><select id="status"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><div id="reviews"></div></div><script>const API='https://api.betheltradingtechnologies.com';const box=document.getElementById('reviews'),status=document.getElementById('status');function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}async function load(){box.textContent='Loading…';const r=await fetch(API+'/admin/reviews?status='+encodeURIComponent(status.value),{credentials:'include',headers:{Accept:'application/json'}});if(!r.ok){box.textContent='Unable to load reviews. Sign in as an administrator first.';return}const d=await r.json();box.innerHTML='';(d.reviews||[]).forEach(v=>{const c=document.createElement('div');c.className='card';c.innerHTML='<strong></strong><div class="stars"></div><p></p><div class="meta"></div><div class="actions"><button class="approve">Approve</button><button class="reject">Reject</button></div>';c.querySelector('strong').textContent=v.display_name;c.querySelector('.stars').textContent=stars(v.rating);c.querySelector('p').textContent=v.review;c.querySelector('.meta').textContent=(v.email?('Private contact: '+v.email+' • '):'')+new Date(v.created_at).toLocaleString();c.querySelector('.approve').onclick=()=>moderate(v.id,'approve');c.querySelector('.reject').onclick=()=>moderate(v.id,'reject');box.appendChild(c)});if(!(d.reviews||[]).length)box.textContent='No reviews in this category.'}async function moderate(id,action){const r=await fetch(API+'/admin/reviews/'+id+'/moderate',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});if(r.ok)load();else alert('Moderation action failed.');}status.onchange=load;load();</script></body></html>
