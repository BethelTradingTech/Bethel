<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f19">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Bethel Admin">
    <title>Bethel Admin Login</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/app-icon.svg">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <main class="login-shell">
        <form id="login-form" class="login-card">
            <img class="admin-logo" src="https://betheltradingtechnologies.com/assets/images/bethel-logo.png?v=20260730" alt="Bethel Trading Technologies">
            <h1>Bethel Trading Technologies</h1>
            <p>Admin Dashboard</p>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button id="login-button" type="submit">Sign in</button>
            <button id="install-app-button" type="button" hidden>Install app</button>
            <p id="login-error" class="login-error" role="alert"></p>
        </form>
    </main>

    <script src="js/auth.js?v=20260725c"></script>
    <script src="js/login.js?v=20260802-secure1"></script>
    <script src="js/pwa.js?v=1"></script>
</body>
</html>
