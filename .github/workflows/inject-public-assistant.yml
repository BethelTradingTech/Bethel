name: Inject Public Assistant Assets

on:
  push:
    branches:
      - codex/public-ai-chat-assistant
    paths:
      - '.github/workflows/inject-public-assistant.yml'
      - 'frontend/js/chat-assistant.js'
      - 'frontend/css/chat-assistant.css'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/public-ai-chat-assistant
      - name: Add assistant assets to existing homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/index.html')
          text = path.read_text(encoding='utf-8')
          css = '    <link rel="stylesheet" href="css/chat-assistant.css?v=1">\n'
          js = '    <script src="js/chat-assistant.js?v=1" defer></script>\n'
          if 'css/chat-assistant.css' not in text:
              text = text.replace('</head>', css + '</head>', 1)
          if 'js/chat-assistant.js' not in text:
              text = text.replace('</body>', js + '</body>', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit additive homepage wiring
        run: |
          if git diff --quiet -- frontend/index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html
          git commit -m "Wire public AI assistant into existing homepage"
          git push
