name: Wire Visitor Reviews
on:
  push:
    branches: [codex/visitor-reviews-ratings]
    paths:
      - '.github/workflows/wire-visitor-reviews.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/visitor-reviews-ratings
      - name: Wire backend and frontend additively
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('render_app.py'); t=p.read_text()
          imp='from api.public_reviews import VisitorReview, router as public_reviews_router\n'
          if imp not in t:
              t=t.replace('from api.public_assistant import router as public_assistant_router\n','from api.public_assistant import router as public_assistant_router\n'+imp)
          marker='PUBLIC_ASSISTANT_PATH = "/public/assistant/chat"\n'
          if 'PUBLIC_REVIEWS_PATH' not in t:
              t=t.replace(marker,marker+'PUBLIC_REVIEWS_PATH = "/public/reviews"\n')
          block='''\nVisitorReview.__table__.create(bind=api_engine, checkfirst=True)\nif not _route_exists(PUBLIC_REVIEWS_PATH):\n    app.include_router(public_reviews_router)\n    print("Bethel moderated visitor reviews loaded")\n'''
          if 'Bethel moderated visitor reviews loaded' not in t:
              t=t.replace('app.router.routes[:] = [',block+'\napp.router.routes[:] = [',1)
          p.write_text(t)

          p=Path('frontend/js/chat-assistant.js'); t=p.read_text()
          loader='''\n  if(!document.querySelector('link[href*="visitor-reviews.css"]')){const l=document.createElement("link");l.rel="stylesheet";l.href="css/visitor-reviews.css?v=1";document.head.appendChild(l);}\n  if(!document.querySelector('script[src*="visitor-reviews.js"]')){const s=document.createElement("script");s.src="js/visitor-reviews.js?v=1";s.defer=true;document.body.appendChild(s);}\n'''
          if 'visitor-reviews.js' not in t:
              t=t.replace('})();',loader+'})();',1)
          p.write_text(t)

          p=Path('render.yaml'); t=p.read_text()
          needle='      - key: PUBLIC_SUPPORT_EMAIL\n        value: info@betheltradingtechnologies.com\n'
          addition='      - key: REVIEW_HASH_SALT\n        generateValue: true\n'
          if 'REVIEW_HASH_SALT' not in t:
              t=t.replace(needle,needle+addition)
          p.write_text(t)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add render_app.py render.yaml frontend/js/chat-assistant.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire moderated visitor reviews into Bethel"
          git push
