name: Payment Model Metadata CI

on:
  pull_request:
    paths:
      - "api/database.py"
      - "api/payment_admin/models.py"
      - "tests/test_payment_admin_model_reload.py"
      - ".github/workflows/payment-model-ci.yml"
  push:
    branches: [main, "fix/**"]
    paths:
      - "api/database.py"
      - "api/payment_admin/models.py"
      - "tests/test_payment_admin_model_reload.py"
      - ".github/workflows/payment-model-ci.yml"

permissions:
  contents: read

jobs:
  metadata-reload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest sqlalchemy
      - name: Run payment metadata reload regression
        run: pytest -q tests/test_payment_admin_model_reload.py
