name: Analytics Risk V2 Tests

on:
  push:
    branches:
      - analytics-risk-v2
      - fix/authentic-period-returns
    paths:
      - "api/services/analytics_v2.py"
      - "api/services/analytics_comparison.py"
      - "api/services/period_returns.py"
      - "api/services/performance_report.py"
      - "api/routes/performance/router.py"
      - "tests/test_analytics_v2.py"
      - "tests/test_analytics_comparison.py"
      - "tests/test_period_returns.py"
      - ".github/workflows/test-analytics-risk-v2.yml"
  pull_request:
    paths:
      - "api/services/analytics_v2.py"
      - "api/services/analytics_comparison.py"
      - "api/services/period_returns.py"
      - "api/services/performance_report.py"
      - "api/routes/performance/router.py"
      - "tests/test_analytics_v2.py"
      - "tests/test_analytics_comparison.py"
      - "tests/test_period_returns.py"
      - ".github/workflows/test-analytics-risk-v2.yml"

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run isolated analytics tests
        env:
          DATABASE_URL: sqlite:///./analytics_v2_ci.db
        run: python -m pytest tests/test_analytics_v2.py tests/test_analytics_comparison.py tests/test_period_returns.py -v
