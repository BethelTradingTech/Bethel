name: Analytics Risk V2 Tests

on:
  push:
    branches:
      - analytics-risk-v2
      - fix/authentic-period-returns
      - research/fxblue-normalized-returns
      - fix/fxblue-banked-return-audit
    paths:
      - "api/services/analytics_v2.py"
      - "api/services/analytics_comparison.py"
      - "api/services/period_returns.py"
      - "api/services/performance_report.py"
      - "api/services/normalized_returns.py"
      - "api/services/normalized_return_preview.py"
      - "api/services/fxblue_banked_return.py"
      - "api/services/account_risk_profile.py"
      - "api/services/ledger_reconciliation.py"
      - "api/services/ledger_var.py"
      - "api/services/performance_engine.py"
      - "api/routes/performance/router.py"
      - "tests/test_analytics_v2.py"
      - "tests/test_analytics_comparison.py"
      - "tests/test_period_returns.py"
      - "tests/test_normalized_returns.py"
      - "tests/test_normalized_return_preview.py"
      - "tests/test_fxblue_banked_return.py"
      - "tests/test_ledger_reconciliation.py"
      - "docs/FXBLUE_RETURN_METHODOLOGY.md"
      - ".github/workflows/test-analytics-risk-v2.yml"
  pull_request:
    paths:
      - "api/services/analytics_v2.py"
      - "api/services/analytics_comparison.py"
      - "api/services/period_returns.py"
      - "api/services/performance_report.py"
      - "api/services/normalized_returns.py"
      - "api/services/normalized_return_preview.py"
      - "api/services/fxblue_banked_return.py"
      - "api/services/account_risk_profile.py"
      - "api/services/ledger_reconciliation.py"
      - "api/services/ledger_var.py"
      - "api/services/performance_engine.py"
      - "api/routes/performance/router.py"
      - "tests/test_analytics_v2.py"
      - "tests/test_analytics_comparison.py"
      - "tests/test_period_returns.py"
      - "tests/test_normalized_returns.py"
      - "tests/test_normalized_return_preview.py"
      - "tests/test_fxblue_banked_return.py"
      - "tests/test_ledger_reconciliation.py"
      - "docs/FXBLUE_RETURN_METHODOLOGY.md"
      - ".github/workflows/test-analytics-risk-v2.yml"

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run isolated analytics tests
        env:
          DATABASE_URL: sqlite:///./analytics_v2_ci.db
          JWT_SECRET_KEY: analytics-risk-ci-only-key-000000000000000000000000000000000000000000000000
          SUBSCRIBER_JWT_SECRET_KEY: analytics-risk-ci-subscriber-only-key-000000000000000000000000000000000000000000000000
        run: python -m pytest tests/test_analytics_v2.py tests/test_analytics_comparison.py tests/test_period_returns.py tests/test_normalized_returns.py tests/test_normalized_return_preview.py tests/test_fxblue_banked_return.py tests/test_ledger_reconciliation.py -v
