name: CopyHub v2 Safety CI

on:
  pull_request:
    paths:
      - "api/copyhub/**"
      - "connector/mt5_*"
      - "connector/bethel_copier_app.py"
      - "connector/*master_terminal_instance.ps1"
      - "render_app.py"
      - "tests/test_copyhub_v2_contract.py"
      - ".github/workflows/copyhub-v2-ci.yml"
  push:
    branches:
      - fix/package-routed-multi-master-copyhub
    paths:
      - "api/copyhub/**"
      - "connector/mt5_*"
      - "connector/bethel_copier_app.py"
      - "connector/*master_terminal_instance.ps1"
      - "render_app.py"
      - "tests/test_copyhub_v2_contract.py"
      - ".github/workflows/copyhub-v2-ci.yml"

permissions:
  contents: read

jobs:
  contract-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: pip install pytest
      - name: Compile CopyHub v2 Python sources
        run: |
          python -m py_compile \
            api/copyhub/models.py \
            api/copyhub/diagnostics.py \
            api/copyhub/package_router.py \
            connector/mt5_readonly_connector.py \
            connector/mt5_master_event_publisher.py \
            connector/mt5_subscriber_copier.py \
            connector/bethel_copier_app.py \
            render_app.py
      - name: Run routing and fail-closed contract tests
        run: pytest -q tests/test_copyhub_v2_contract.py
