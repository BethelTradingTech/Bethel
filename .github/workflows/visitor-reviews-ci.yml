name: Visitor Reviews CI
on:
  pull_request:
    paths:
      - 'api/public_reviews.py'
      - 'render_app.py'
      - 'render.yaml'
      - 'frontend/js/visitor-reviews.js'
      - 'frontend/css/visitor-reviews.css'
      - 'frontend/js/chat-assistant.js'
      - 'admin-frontend/reviews.html'
      - 'scripts/visitor_reviews_gate.py'
      - '.github/workflows/visitor-reviews-ci.yml'
  push:
    branches: [main]
    paths:
      - 'api/public_reviews.py'
      - 'render_app.py'
      - 'frontend/js/visitor-reviews.js'
      - 'scripts/visitor_reviews_gate.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile reviews backend
        run: python -m py_compile api/public_reviews.py
      - name: Verify reviews safeguards
        run: python scripts/visitor_reviews_gate.py
