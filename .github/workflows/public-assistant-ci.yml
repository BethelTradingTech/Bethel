name: Public Assistant CI

on:
  pull_request:
    paths:
      - 'api/public_assistant.py'
      - 'api/ai_config.py'
      - 'render.yaml'
      - 'render_app.py'
      - 'frontend/index.html'
      - 'frontend/js/chat-assistant.js'
      - 'frontend/css/chat-assistant.css'
      - 'scripts/public_assistant_gate.py'
      - '.github/workflows/public-assistant-ci.yml'
  push:
    branches: [main]
    paths:
      - 'api/public_assistant.py'
      - 'api/ai_config.py'
      - 'render.yaml'
      - 'render_app.py'
      - 'frontend/index.html'
      - 'frontend/js/chat-assistant.js'
      - 'frontend/css/chat-assistant.css'
      - 'scripts/public_assistant_gate.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile assistant and AI configuration
        run: python -m py_compile api/public_assistant.py api/ai_config.py
      - name: Verify assistant safeguards and additive wiring
        run: python scripts/public_assistant_gate.py
