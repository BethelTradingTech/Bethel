name: Bethel Native KYC CI

on:
  pull_request:
    paths:
      - "api/kyc/**"
      - "scripts/refresh_bethel_sanctions.py"
      - "render_app.py"
      - "investor-frontend/js/native-kyc.js"
      - "investor-frontend/js/onboarding-workflow-v2.js"
      - "admin-frontend/js/admin-kyc-review.js"
      - "admin-frontend/js/api.js"
      - "config/production.env.example"
      - "requirements.txt"
      - ".github/workflows/native-kyc-ci.yml"
  workflow_dispatch:

jobs:
  native-kyc:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./native_kyc_ci.db
      BETHEL_ENVIRONMENT: DEVELOPMENT
      JWT_SECRET_KEY: ci-jwt-secret-key-0123456789abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ
      SUBSCRIBER_JWT_SECRET_KEY: ci-subscriber-jwt-secret-0123456789abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ
      IDENTITY_VERIFICATION_MODE: sumsub
      KYC_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      KYC_STORAGE_ROOT: /tmp/bethel-native-kyc
      KYC_STORAGE_PERSISTENT: "true"
      KYC_MALWARE_SCANNER_BASE_URL: http://localhost:9991
      KYC_MALWARE_SCANNER_API_KEY: ci-key
      KYC_OCR_BASE_URL: http://localhost:9992
      KYC_OCR_API_KEY: ci-key
      KYC_AUTHENTICITY_VERIFIER_BASE_URL: http://localhost:9993
      KYC_AUTHENTICITY_VERIFIER_API_KEY: ci-key
      KYC_BIOMETRIC_VERIFIER_BASE_URL: http://localhost:9994
      KYC_BIOMETRIC_VERIFIER_API_KEY: ci-key
      AML_SCREENING_MODE: local_dataset
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile native KYC source
        run: python -m py_compile api/kyc/native_models.py api/kyc/native_engine.py api/kyc/ai_assessment.py api/kyc/native_routes.py api/kyc/admin_review_routes.py api/kyc/routes.py scripts/refresh_bethel_sanctions.py render_app.py
      - name: Check native KYC admin JavaScript syntax
        run: node --check admin-frontend/js/admin-kyc-review.js && node --check admin-frontend/js/api.js
      - name: Verify assisted scoring fails closed on missing biometrics/OCR
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          from api.kyc.ai_assessment import assisted_assessment
          def row(status, score=None): return SimpleNamespace(status=status, score=score, reasons=[])
          checks={
            "document": row("passed",100), "malware": row("passed",100),
            "authenticity": row("passed",100), "sanctions": row("passed",100),
            "ocr": row("not_available"), "field_match": row("not_available"),
            "liveness": row("not_available"), "face_match": row("not_available"),
          }
          result=assisted_assessment(checks)
          assert result["recommendation"] == "MANUAL_REVIEW_REQUIRED"
          assert result["auto_decision"] is False
          assert result["evidence_coverage_score"] < 100
          print(result)
          PY
      - name: Verify native KYC tables and readiness
        run: |
          python - <<'PY'
          from api.database import Base, SessionLocal, engine
          from api.kyc import native_models
          from api.kyc.native_engine import readiness
          Base.metadata.create_all(bind=engine)
          db=SessionLocal()
          state=readiness(db)
          assert state["checks"]["encryption_key"] is True
          assert state["checks"]["private_persistent_storage"] is True
          assert state["checks"]["sanctions_data"] is False
          assert state["ready_for_native_identity"] is False
          db.close()
          print(state)
          PY
      - name: Verify native route definitions
        run: |
          python - <<'PY'
          from api.kyc.native_routes import router as native_router
          from api.kyc.admin_review_routes import router as admin_review_router
          paths={getattr(route, "path", "") for route in native_router.routes}
          assert "/kyc/native/readiness" in paths
          assert "/kyc/{subscriber_id}/native/session" in paths
          assert "/kyc/{subscriber_id}/native/submit" in paths
          assert "/kyc/{subscriber_id}/native/status" in paths
          review_paths={getattr(route, "path", "") for route in admin_review_router.routes}
          assert "/admin/kyc/native/{subscriber_id}" in review_paths
          assert "/admin/kyc/native/{subscriber_id}/evidence/{category}" in review_paths
          assert "/admin/kyc/native/{subscriber_id}/decision" in review_paths
          print("native KYC and compliance-review route definitions ok")
          PY
      - name: Import production entrypoint
        run: python -c "import render_app; print('render_app import ok')"
      - name: Build production container
        run: docker build -t bethel-native-kyc-ci .
