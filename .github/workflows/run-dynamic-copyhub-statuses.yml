name: Run Dynamic Copy Hub Statuses
on:
  push:
    branches:
      - fix/dynamic-copyhub-statuses
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dynamic-copyhub-statuses
          fetch-depth: 0
      - run: python scripts/apply_dynamic_copyhub_statuses.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Copy Hub statuses fully dynamic"
          git push origin HEAD:fix/dynamic-copyhub-statuses
