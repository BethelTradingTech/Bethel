services:
  - type: web
    name: bethel-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: BETHEL_ENVIRONMENT
        value: PRODUCTION
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: bethel-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SUBSCRIBER_JWT_SECRET_KEY
        generateValue: true
      - key: MT5_CONNECTOR_SECRET
        sync: false
      - key: MASTER_MT5_ACCOUNTS
        value: "49617874"
      - key: MASTER_ACCOUNT_MODE
        value: DEMO
      - key: BROADCAST_WORKER_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BETHEL_ASSISTANT_MODEL
        value: gpt-5.6-luna
      - key: BETHEL_ASSISTANT_WINDOW_SECONDS
        value: "3600"
      - key: BETHEL_ASSISTANT_MAX_REQUESTS_PER_WINDOW
        value: "8"
      - key: BETHEL_ASSISTANT_MAX_MESSAGE_CHARS
        value: "500"
      - key: BETHEL_ASSISTANT_MAX_OUTPUT_TOKENS
        value: "140"
      - key: PUBLIC_SUPPORT_EMAIL
        value: info@betheltradingtechnologies.com
      - key: REVIEW_HASH_SALT
        generateValue: true
      - key: DAILY_MARKET_BRIEF_INTAKE_TOKEN
        sync: false

  - type: web
    name: bethel-broadcast
    runtime: docker
    dockerfilePath: ./broadcast-worker/Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: BETHEL_API_BASE
        value: https://api.betheltradingtechnologies.com
      - key: BROADCAST_WORKER_SECRET
        sync: false
      - key: MEDIA_ROOT
        value: /var/data/bethel-media
    disk:
      name: bethel-media
      mountPath: /var/data
      sizeGB: 1

  - type: cron
    name: bethel-sanctions-refresh
    runtime: docker
    plan: starter
    schedule: "0 2 * * *"
    dockerCommand: python scripts/refresh_bethel_sanctions.py
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bethel-db
          property: connectionString

  - type: cron
    name: bethel-security-compliance-check
    runtime: docker
    plan: starter
    schedule: "30 2 * * *"
    dockerCommand: python scripts/security_compliance_snapshot.py
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bethel-db
          property: connectionString
      - key: BETHEL_PUBLIC_API_BASE
        value: https://api.betheltradingtechnologies.com

  - type: cron
    name: bethel-daily-market-brief
    runtime: docker
    plan: starter
    schedule: "15 22 * * 1-5"
    dockerCommand: python scripts/daily_market_brief.py
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bethel-db
          property: connectionString
      - key: BETHEL_PUBLIC_API_BASE
        value: https://api.betheltradingtechnologies.com
      - key: DAILY_MARKET_BRIEF_PUBLIC_URL
        value: https://betheltradingtechnologies.com/daily-market-brief.html
      - key: DAILY_MARKET_BRIEF_RECIPIENTS
        value: info@betheltradingtechnologies.com
      - key: DAILY_MARKET_BRIEF_SOCIAL_PUBLISHING_ENABLED
        value: "false"
      - key: DAILY_MARKET_BRIEF_SOCIAL_WEBHOOK_TOKEN
        sync: false
      - key: DAILY_MARKET_BRIEF_FACEBOOK_WEBHOOK
        sync: false
      - key: DAILY_MARKET_BRIEF_INSTAGRAM_WEBHOOK
        sync: false
      - key: DAILY_MARKET_BRIEF_X_WEBHOOK
        sync: false
      - key: DAILY_MARKET_BRIEF_LINKEDIN_WEBHOOK
        sync: false
      - key: DAILY_MARKET_BRIEF_TIKTOK_WEBHOOK
        sync: false
      - key: DAILY_MARKET_BRIEF_YOUTUBE_WEBHOOK
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_SSL
        value: "false"
      - key: SMTP_USE_STARTTLS
        value: "true"

databases:
  - name: bethel-db
    plan: basic-256mb
    databaseName: bethel
    user: bethel_admin
