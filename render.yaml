services:
  - type: web
    name: bethel-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: BETHEL_ENVIRONMENT
        value: PRODUCTION
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: bethel-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SUBSCRIBER_JWT_SECRET_KEY
        generateValue: true
      - key: MT5_CONNECTOR_SECRET
        sync: false
      - key: MASTER_MT5_ACCOUNTS
        value: "49617874"
      - key: MASTER_ACCOUNT_MODE
        value: DEMO
      - key: BROADCAST_WORKER_SECRET
        sync: false

  - type: web
    name: bethel-broadcast
    runtime: docker
    dockerfilePath: ./broadcast-worker/Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: BETHEL_API_BASE
        value: https://api.betheltradingtechnologies.com
      - key: BROADCAST_WORKER_SECRET
        sync: false

databases:
  - name: bethel-db
    plan: basic-256mb
    databaseName: bethel
    user: bethel_admin
