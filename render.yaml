services:
  - type: web
    name: bethel-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: BETHEL_ENVIRONMENT
        value: PRODUCTION
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: bethel-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SUBSCRIBER_JWT_SECRET_KEY
        generateValue: true
      - key: MT5_CONNECTOR_SECRET
        sync: false
      - key: MASTER_MT5_ACCOUNTS
        value: "49617874"
      - key: MASTER_ACCOUNT_MODE
        value: DEMO
      - key: BROADCAST_WORKER_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BETHEL_ASSISTANT_MODEL
        value: gpt-5.6
      - key: PUBLIC_SUPPORT_EMAIL
        value: info@betheltradingtechnologies.com

  - type: web
    name: bethel-broadcast
    runtime: docker
    dockerfilePath: ./broadcast-worker/Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: BETHEL_API_BASE
        value: https://api.betheltradingtechnologies.com
      - key: BROADCAST_WORKER_SECRET
        sync: false
      - key: MEDIA_ROOT
        value: /var/data/bethel-media
    disk:
      name: bethel-media
      mountPath: /var/data
      sizeGB: 1

  - type: cron
    name: bethel-sanctions-refresh
    runtime: docker
    plan: starter
    schedule: "0 2 * * *"
    dockerCommand: python scripts/refresh_bethel_sanctions.py
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bethel-db
          property: connectionString

  - type: cron
    name: bethel-security-compliance-check
    runtime: docker
    plan: starter
    schedule: "30 2 * * *"
    dockerCommand: python scripts/security_compliance_snapshot.py
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bethel-db
          property: connectionString
      - key: BETHEL_PUBLIC_API_BASE
        value: https://api.betheltradingtechnologies.com

databases:
  - name: bethel-db
    plan: basic-256mb
    databaseName: bethel
    user: bethel_admin
