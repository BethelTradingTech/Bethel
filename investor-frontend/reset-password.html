<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bethel Trading | Reset Password</title>
  <link rel="stylesheet" href="css/investor.css?v=6">
</head>
<body>
<main class="auth-shell"><section class="panel">
  <img class="portal-logo" src="/assets/images/bethel-logo.png" alt="Bethel Trading Technologies logo">
  <p class="eyebrow">Bethel Trading Technologies</p>
  <h1>Create a new password</h1>
  <p>Use at least 12 characters with uppercase, lowercase, number and special character.</p>
  <form id="reset-password-form">
    <label for="password">New password</label>
    <input id="password" type="password" autocomplete="new-password" minlength="12" required>
    <label for="confirm-password">Confirm password</label>
    <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required>
    <button type="submit">Reset password</button>
    <p id="message"></p>
  </form>
  <p><a href="onboarding.html">Return to subscriber sign in</a></p>
</section></main>
<script src="js/reset-password.js?v=1"></script>
</body>
</html>
