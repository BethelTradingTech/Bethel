<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f19">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Bethel Investor">
    <title>Bethel Investor Login</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/app-icon.svg">
    <link rel="stylesheet" href="css/investor.css?v=6">
</head>
<body>
    <main class="container" style="max-width: 440px; padding-top: 10vh;">
        <section class="panel">
            <img class="portal-logo" src="https://betheltradingtechnologies.com/assets/images/bethel-logo.png?v=20260730" alt="Bethel Trading Technologies logo">
            <h1>Bethel Trading</h1>
            <p>Private Investor Dashboard</p>
            <form id="login-form">
                <label for="email">Email</label>
                <input id="email" type="email" autocomplete="username" required>

                <label for="password">Password</label>
                <input id="password" type="password" autocomplete="current-password" required>

            <button id="login-button" type="submit">Sign in</button>
            <button id="install-app-button" type="button" hidden>Install app</button>
                <p id="login-error" role="alert"></p>
            </form>
        </section>
    </main>

    <script src="js/auth.js?v=3"></script>
    <script src="js/login.js?v=3"></script>
    <script src="js/pwa.js?v=2"></script>
</body>
</html>
