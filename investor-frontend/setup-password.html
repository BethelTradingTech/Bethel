<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create subscriber password | Bethel Trading Technologies</title>
    <link rel="stylesheet" href="css/investor.css?v=6">
    <link rel="stylesheet" href="css/onboarding.css?v=3">
</head>
<body>
<main class="onboarding-shell">
    <section class="onboarding-panel" id="login-panel">
        <img class="portal-logo" src="https://betheltradingtechnologies.com/assets/images/bethel-logo.png" alt="Bethel Trading Technologies logo">
        <p class="eyebrow">Bethel Trading Technologies</p>
        <h1>Create your password</h1>
        <p class="muted">This one-time setup link expires after 24 hours.</p>
        <form id="setup-form">
            <label for="password">New password</label>
            <input id="password" type="password" minlength="12"
                   autocomplete="new-password" required>
            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" type="password" minlength="12"
                   autocomplete="new-password" required>
            <p class="muted">Use at least 12 characters with uppercase,
            lowercase, a number and a special character.</p>
            <button type="submit">Create password</button>
            <p id="setup-message" class="form-message"></p>
        </form>
        <a id="login-link" href="onboarding.html" hidden>Continue to sign in</a>
    </section>
</main>
<script src="js/setup-password.js?v=1"></script>
</body>
</html>
