<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bethel Trading | Forgot Password</title>
  <link rel="stylesheet" href="css/investor.css?v=4">
</head>
<body>
<main class="auth-shell"><section class="panel">
  <p class="eyebrow">Bethel Trading Technologies</p>
  <h1>Reset your password</h1>
  <p>Enter your subscriber email. If the account exists, a secure reset link will be emailed to you.</p>
  <form id="forgot-password-form">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required>
    <button type="submit">Send reset link</button>
    <p id="message"></p>
  </form>
  <p><a href="onboarding.html">Return to subscriber sign in</a></p>
</section></main>
<script src="js/forgot-password.js?v=1"></script>
</body>
</html>
